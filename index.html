<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zapier Bot</title>
    <style>
      body, html { margin: 0; width: 100%; height: 100vh; overflow: hidden; }
      iframe { width: 100%; height: 100%; border: none; }
    </style>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const frame = document.querySelector('iframe');
        let loaded = false;
        frame.addEventListener('load', () => { loaded = true; });
        setTimeout(() => {
          if (!loaded) window.location.replace(frame.src);
        }, 1000);
      });
    </script>
  </head>
  <body>
    <iframe src="https://acc-guide.zapier.app"></iframe>
  </body>
</html>
